<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Accent/Glow Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Pipeline container box -->
  <rect x="60" y="80" width="680" height="460" rx="20" fill="url(#vectorGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="115" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">HYBRID RETRIEVAL &amp; RAG ENGINE</text>

  <!-- Step 1: PDF Document Ingestion (Left) -->
  <g transform="translate(100, 180)" filter="url(#shadow)">
    <rect width="130" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect width="130" height="6" fill="url(#greenGrad)" rx="3"/>
    <text x="65" y="32" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PDF Ingestion</text>
    
    <!-- File Icon Design -->
    <rect x="45" y="55" width="40" height="50" rx="4" fill="#0B1120" stroke="#334155"/>
    <line x1="53" y1="70" x2="77" y2="70" stroke="#94A3B8" stroke-width="2"/>
    <line x1="53" y1="80" x2="77" y2="80" stroke="#94A3B8" stroke-width="2"/>
    <line x1="53" y1="90" x2="68" y2="90" stroke="#34D399" stroke-width="2"/>

    <text x="65" y="130" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Semantic Chunking</text>
  </g>

  <!-- Connection Line 1 -->
  <path d="M 230 255 L 290 255" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- Step 2: Vector Space & Dense Embedding (Center) -->
  <g transform="translate(290, 140)" filter="url(#shadow)">
    <rect width="220" height="230" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="26" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Qdrant Vector Index</text>
    
    <!-- 3D Vector grid mock -->
    <rect x="20" y="45" width="180" height="130" rx="8" fill="#0B1120" stroke="#1D2939"/>
    
    <!-- Coordinate lines -->
    <line x1="30" y1="150" x2="190" y2="150" stroke="#334155" stroke-width="1"/>
    <line x1="30" y1="60" x2="30" y2="150" stroke="#334155" stroke-width="1"/>
    <line x1="30" y1="150" x2="100" y2="80" stroke="#334155" stroke-width="1"/>
    
    <!-- Vector data points -->
    <circle cx="60" cy="110" r="5" fill="#34D399" filter="url(#glow)"/>
    <circle cx="120" cy="90" r="4" fill="#34D399" opacity="0.6"/>
    <circle cx="150" cy="130" r="6" fill="#60A5FA" opacity="0.7"/>
    <circle cx="90" cy="70" r="4" fill="#60A5FA" opacity="0.4"/>
    
    <!-- Query Vector Match Connection -->
    <line x1="60" y1="110" x2="150" y2="130" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Vector text math -->
    <text x="110" y="202" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="9" font-weight="700">Cosine Similarity: 0.941</text>
    <text x="110" y="216" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="8" font-weight="600">BM25 + Vector Hybrid Search</text>
  </g>

  <!-- Connection Line 2 -->
  <path d="M 510 255 L 570 255" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- Step 3: LLM Generation / Context Output (Right) -->
  <g transform="translate(570, 180)" filter="url(#shadow)">
    <rect width="130" height="150" rx="12" fill="#1E293B" stroke="url(#greenGrad)" stroke-width="2"/>
    <text x="65" y="32" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">LLM Generation</text>
    
    <!-- Chat Bubble Mock -->
    <rect x="15" y="55" width="100" height="50" rx="6" fill="#0B1120" stroke="#334155"/>
    <text x="25" y="74" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="bold">AI Answer:</text>
    <rect x="25" y="82" width="80" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="25" y="90" width="60" height="3" rx="1.5" fill="#CBD5E1"/>

    <!-- Source citation tag -->
    <rect x="15" y="115" width="100" height="20" rx="10" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.2)"/>
    <text x="65" y="128" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="8" font-weight="800">Source cited: Doc #3</text>
  </g>

  <!-- Top Ingestion flow badge -->
  <g transform="translate(340, 420)" filter="url(#shadow)">
    <rect width="120" height="40" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11" font-weight="800">&lt; 200 ms</text>
  </g>
</svg>
