<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Accent/Glow Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <!-- Filter Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Network Core / VPC border -->
  <rect x="80" y="100" width="640" height="440" rx="24" fill="url(#cyberGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="135" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">AWS VPC (VIRTUAL PRIVATE CLOUD)</text>

  <!-- ALB (Application Load Balancer) Node -->
  <g transform="translate(140, 250)" filter="url(#shadow)">
    <rect width="120" height="100" rx="14" fill="#1E293B" stroke="url(#orangeGrad)" stroke-width="2"/>
    <text x="60" y="36" text-anchor="middle" fill="#FBBF24" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="0.5">ALB</text>
    <rect x="20" y="52" width="80" height="4" rx="2" fill="#FBBF24" opacity="0.3"/>
    <rect x="20" y="64" width="80" height="4" rx="2" fill="#FBBF24" opacity="0.3"/>
    <text x="60" y="84" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Port 80/443</text>
  </g>

  <!-- Cloud instances group (autoscaling) -->
  <g transform="translate(380, 140)" filter="url(#shadow)">
    <!-- Group label -->
    <rect x="-10" y="-15" width="280" height="300" rx="16" fill="#0B1120" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>
    <text x="10" y="15" fill="#FBBF24" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="1">AUTO-SCALING WORKERS (EC2)</text>

    <!-- Instance 1 -->
    <g transform="translate(20, 40)">
      <rect width="210" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="30" r="8" fill="#34D399" filter="url(#glow)"/>
      <text x="45" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="700">challenge-instance-01</text>
      <text x="45" y="44" fill="#94A3B8" font-family="monospace" font-size="9">IP: 10.0.1.42 (Healthy)</text>
      <rect x="165" y="20" width="30" height="20" rx="4" fill="#0B1120" stroke="#334155"/>
      <text x="180" y="32" text-anchor="middle" fill="#3B82F6" font-family="sans-serif" font-size="9" font-weight="bold">AMI</text>
    </g>

    <!-- Instance 2 -->
    <g transform="translate(20, 120)">
      <rect width="210" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="30" r="8" fill="#34D399" filter="url(#glow)"/>
      <text x="45" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="700">challenge-instance-02</text>
      <text x="45" y="44" fill="#94A3B8" font-family="monospace" font-size="9">IP: 10.0.1.97 (Healthy)</text>
      <rect x="165" y="20" width="30" height="20" rx="4" fill="#0B1120" stroke="#334155"/>
      <text x="180" y="32" text-anchor="middle" fill="#3B82F6" font-family="sans-serif" font-size="9" font-weight="bold">AMI</text>
    </g>

    <!-- Instance n (Representing scale) -->
    <g transform="translate(20, 200)">
      <rect width="210" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <circle cx="25" cy="30" r="8" fill="#34D399" opacity="0.6"/>
      <text x="45" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="700">challenge-instance-n...</text>
      <text x="45" y="44" fill="#94A3B8" font-family="monospace" font-size="9">IP: 10.0.1.189 (Active)</text>
      <text x="175" y="35" fill="#34D399" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">1k+</text>
    </g>
  </g>

  <!-- Network traffic flow (ALB to Instances) -->
  <path d="M 260 280 Q 320 280 380 200" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="50;0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 260 300 Q 320 300 380 280" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="50;0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 260 320 Q 320 320 380 360" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="50;0" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Ingress traffic input -->
  <g transform="translate(20, 280)">
    <path d="M 0 20 L 100 20" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 4" fill="none">
      <animate attributeName="stroke-dashoffset" values="50;0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="10" cy="20" r="4" fill="#3B82F6" filter="url(#glow)"/>
    <text x="0" y="0" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="1">USER REQUESTS</text>
  </g>

  <!-- Database / Scoreboard Cache (Redis) -->
  <g transform="translate(140, 410)" filter="url(#shadow)">
    <rect width="120" height="70" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.5"/>
    <text x="60" y="26" text-anchor="middle" fill="#F87171" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">REDIS CACHE</text>
    <text x="60" y="44" text-anchor="middle" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Scoreboard Sync</text>
    <text x="60" y="56" text-anchor="middle" fill="#F87171" font-family="monospace" font-size="8" font-weight="700">Sub-ms Read</text>
    <!-- DB Cylinder Symbol -->
    <path d="M 15 15 C 15 10, 25 10, 25 15 L 25 35 C 25 40, 15 40, 15 35 Z" fill="none" stroke="#F87171" stroke-width="1" opacity="0.3"/>
  </g>

  <path d="M 200 350 L 200 410" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
</svg>