<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    
    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Decorative Orbit Circles -->
  <circle cx="400" cy="300" r="220" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="400" cy="300" r="140" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Duel Matchmaking Visual (Center) -->
  <g filter="url(#glow)">
    <circle cx="400" cy="300" r="50" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2"/>
    <circle cx="400" cy="300" r="70" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.3">
      <animate attributeName="r" values="50;90;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="400" y="306" text-anchor="middle" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="18" font-weight="800" letter-spacing="1">VS</text>

  <!-- Left Player Card (User 1) -->
  <g transform="translate(60, 150)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="250" height="300" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="300" rx="16" fill="url(#pulseGrad)" />
    
    <!-- User Info -->
    <circle cx="40" cy="40" r="16" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="40" y="44" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="bold">&lt;/&gt;</text>
    <text x="70" y="36" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Coder_A</text>
    <text x="70" y="50" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Rating: 1610</text>
    
    <!-- Code Editor Mock -->
    <rect x="15" y="75" width="220" height="170" rx="8" fill="#0B1120" stroke="#1E293B"/>
    <!-- Code Lines -->
    <rect x="25" y="90" width="100" height="6" rx="3" fill="#60A5FA" opacity="0.8"/>
    <rect x="25" y="104" width="140" height="6" rx="3" fill="#34D399" opacity="0.6"/>
    <rect x="40" y="118" width="110" height="6" rx="3" fill="#FBBF24" opacity="0.7"/>
    <rect x="40" y="132" width="70" height="6" rx="3" fill="#60A5FA" opacity="0.5"/>
    <rect x="40" y="146" width="120" height="6" rx="3" fill="#CBD5E1" opacity="0.3"/>
    <rect x="25" y="160" width="50" height="6" rx="3" fill="#34D399" opacity="0.8"/>
    <!-- Typing Cursor -->
    <rect x="78" y="158" width="2" height="10" fill="#34D399">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Submission Status -->
    <rect x="15" y="255" width="220" height="30" rx="6" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.2)"/>
    <circle cx="30" cy="270" r="5" fill="#34D399"/>
    <text x="45" y="274" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">All tests passed (10/10)</text>
  </g>

  <!-- Right Player Card (User 2) -->
  <g transform="translate(490, 150)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="250" height="300" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    
    <!-- User Info -->
    <circle cx="40" cy="40" r="16" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="40" y="44" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" font-weight="bold">JS</text>
    <text x="70" y="36" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Opponent_X</text>
    <text x="70" y="50" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Rating: 1585</text>
    
    <!-- Code Editor Mock -->
    <rect x="15" y="75" width="220" height="170" rx="8" fill="#0B1120" stroke="#1E293B"/>
    <!-- Code Lines -->
    <rect x="25" y="90" width="120" height="6" rx="3" fill="#60A5FA" opacity="0.6"/>
    <rect x="25" y="104" width="80" height="6" rx="3" fill="#F87171" opacity="0.7"/>
    <rect x="40" y="118" width="130" height="6" rx="3" fill="#CBD5E1" opacity="0.4"/>
    <rect x="40" y="132" width="90" height="6" rx="3" fill="#FBBF24" opacity="0.5"/>
    <rect x="40" y="146" width="60" height="6" rx="3" fill="#60A5FA" opacity="0.3"/>
    
    <!-- Submission Status -->
    <rect x="15" y="255" width="220" height="30" rx="6" fill="rgba(248,113,113,0.1)" stroke="rgba(248,113,113,0.2)"/>
    <circle cx="30" cy="270" r="5" fill="#F87171"/>
    <text x="45" y="274" fill="#F87171" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Runtime Error on Test 4</text>
  </g>

  <!-- Glowing Connection Streams -->
  <path d="M 310 250 Q 350 200 400 200" stroke="#60A5FA" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="50;0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 490 250 Q 450 200 400 200" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;50" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Header Info Panel -->
  <g transform="translate(250, 40)" filter="url(#shadow)">
    <rect width="300" height="50" rx="25" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="25" r="8" fill="#34D399" filter="url(#glow)"/>
    <text x="50" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Lobby #4092 — Active Duel</text>
    <text x="240" y="31" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="800">14:52</text>
  </g>
</svg>